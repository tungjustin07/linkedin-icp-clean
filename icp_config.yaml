# ─────────────────────────────────────────────────────────────────────────────
# ICP (Ideal Customer Profile) Configuration
# GTM Systems / RevOps consulting — end-to-end builds, data hygiene, enrichment
# ─────────────────────────────────────────────────────────────────────────────

icp:
  description: >
    Series B through Series E B2B SaaS companies (headcount ~150–2,500) with a
    dedicated RevOps, GTM Systems, or Growth Engineering function that has hit
    the complexity wall — multi-object Salesforce architecture, active enrichment
    pipelines, SFDC CPQ / billing integrations, or a tangled Zapier / Workato
    estate they can no longer self-manage. Two parallel buyer tracks, not one:
    (1) Traditional RevOps leadership — VP / Head / Director of Revenue
    Operations or Sales Operations — who own process and hold budget; and
    (2) Technical GTM Systems leadership — Head of GTM Systems, GTM Engineering
    Lead, Manager of Business Systems, RevOps Architect, or staff / principal
    RevOps IC — often the ACTUAL technical decision-maker, especially at
    Ramp / Brex / Stripe-style modern orgs where Growth Engineering co-owns GTM
    infrastructure with RevOps. IC champions in MarketingOps, SalesOps, and
    Data Engineering adjacent to GTM are high-value entry points. Past coworkers
    and ops / systems alumni from technically sophisticated B2B SaaS companies
    are HIGHEST-signal regardless of current title. Sweet-spot engagements:
    Salesforce data-model rebuilds, enrichment waterfall design (Clay-anchored),
    integration governance after Zapier / Workato sprawl, SFDC ↔ ERP / CPQ /
    Billing unblocks, and AI / agent-driven RevOps transformation (MCP-to-CRM,
    AI SDR evaluation, LLM-enriched pipelines). Explicitly NOT a founder or CEO
    sale, NOT early-stage pre-RevOps companies, and NOT a pure BI / analytics
    sale — every engagement must touch the GTM system-of-record.

    SCORING HIERARCHY (BOTH tracks are ICP — this ranks them for score
    calibration; the goal of this audit is to PRUNE low-signal connections,
    not to find new leads):
      1. VP / Head / Director of RevOps, Sales Ops, or GTM Systems at
         target-size B2B SaaS → top-tier buyer, score 80–100, KEEP_ENGAGE.
      2. Staff / Principal / Lead GTM Systems, Growth Engineer, or RevOps
         Architect at target-size B2B SaaS → valuable technical influencer
         and referral source, score 60–80, KEEP_ENGAGE or KEEP_NURTURE.
      3. IC-level RevOps / MarketingOps / SalesOps Manager without
         seniority signals at target companies → real but lower-priority,
         score 45–65, KEEP_NURTURE.
      4. Past ops / systems coworkers or alumni of sophisticated B2B SaaS
         orgs, even at off-title current roles → warm network, score 50–70
         based on inferred referral value.
      5. Everyone else — founders / CEOs, non-target industries, off-role ICs,
         pre-RevOps-stage companies, BI-only analytics roles → score <45,
         REMOVE (these are the unfollow candidates).

  # Partial-match strings (case-insensitive substring match).
  target_titles:
    # Primary buyers
    - "VP Revenue Operations"
    - "VP RevOps"
    - "VP of RevOps"
    - "Head of Revenue Operations"
    - "Head of RevOps"
    - "Director of Revenue Operations"
    - "Director of RevOps"
    - "VP Sales Operations"
    - "Director of Sales Operations"
    - "Head of Sales Operations"
    # IC champions
    - "Revenue Operations Manager"
    - "Revenue Operations"
    - "RevOps Manager"
    - "GTM Systems"
    - "GTM Operations"
    - "GTM Engineer"
    - "Sales Operations Manager"
    - "Sales Ops"
    - "Marketing Operations"
    - "Marketing Ops"
    - "CRM Administrator"
    - "CRM Manager"
    - "CRM Architect"
    - "Business Systems"
    - "Go-to-Market"
    # GTM Systems / Growth Engineering track (modern-stack buyers)
    - "Head of GTM Systems"
    - "Director of GTM Systems"
    - "GTM Engineering Lead"
    - "Growth Engineer"
    - "Head of Growth Engineering"
    - "Salesforce Architect"
    - "RevOps Architect"
    - "Principal Salesforce Engineer"
    - "Manager of Business Systems"
    - "Director of Business Systems"
    - "Head of Business Systems"
    - "Head of MarketingOps"
    - "Marketing Operations Lead"
    - "Sales Systems Manager"
    - "Sales Operations Engineer"
    - "Staff RevOps"
    - "Principal RevOps"
    - "Head of Revenue Systems"
    - "Revenue Platform Lead"
    - "GTM Data Engineer"
    # Adjacent buyers
    - "Chief Revenue Officer"
    - "CRO"
    - "VP Marketing"
    - "Head of Marketing"

  # Industries that indicate a good-fit company.
  target_industries:
    - "Software"
    - "SaaS"
    - "Technology"
    - "Information Technology"
    - "Enterprise Software"
    - "Computer Software"
    - "Internet"
    - "FinTech"
    - "MarTech"
    - "Sales Technology"
    - "Data Analytics"
    - "Cloud Computing"
    - "Artificial Intelligence"
    # Sub-buckets surfaced by comment behavior — these are over-represented
    # in Justin's engagement and reveal the modern-stack ICP sweet spot.
    - "Developer Tools"
    - "Infrastructure SaaS"
    - "AI-native SaaS"
    - "LLM Infrastructure"
    - "Applied AI"
    - "Vertical SaaS"
    - "GTM Tooling"
    - "Sales Tech"
    - "Data Platform"
    - "Usage-based SaaS"
    - "Consumption Pricing"

  # Series C–E = typically 200–5000 employees on LinkedIn.
  company_sizes:
    - "201-500"
    - "501-1000"
    - "1001-5000"

  # Profiles matching any anti-pattern are auto-failed at triage.
  # Keep this focused — don't over-filter. Individual sales reps have low
  # purchase authority but can still be referral sources; exclude only clear
  # zero-value profiles.
  anti_patterns:
    - "Student"
    - "Intern"
    - "Recruiter"
    - "Talent Acquisition"
    - "HR Manager"
    - "Human Resources"
    - "People Operations"  # HR rebranded
    - "Personal Trainer"
    - "Real Estate Agent"
    - "Real Estate Broker"
    - "Insurance Agent"
    - "Financial Advisor"
    - "Life Coach"
    - "Account Executive"  # ICs with no buying authority in this context
    - "SDR"
    - "BDR"
    - "Business Development Representative"
    - "Sales Development Representative"
    # Founder / CEO = wrong buyer motion (confirmed by comment behavior —
    # Justin treats founder-led sales as a phase companies should exit).
    - "Founder"
    - "Co-Founder"
    - "CEO"
    - "Chief Executive Officer"

  # Title match weighted highest — buyer is very title-specific.
  # Recency low — a well-connected past coworker from 5 years ago still matters.
  scoring_weights:
    title_match: 0.45
    industry_match: 0.25
    company_size_match: 0.20
    recency: 0.05
    engagement_potential: 0.05

  # Haiku confidence floor to pass to Sonnet.
  triage_pass_threshold: 0.30

  # Sonnet score floor for keep.csv. Set lower than default (65→55) because
  # referral-network value matters even for non-direct buyers.
  keep_score_threshold: 55
